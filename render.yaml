databases:
  - name: aonegt-db
    databaseName: aonegt_db
    user: aonegt_user
    plan: free

services:
  - type: redis
    name: aonegt-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: aonegt-api
    plan: free
    runtime: python
    buildCommand: ./build.sh
    startCommand: daphne aonegt.asgi:application -b 0.0.0.0 -p $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: aonegt-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: aonegt-db
          property: connectionString
      # Comma-separated frontend origins (e.g. https://app.example.com,https://admin.example.com)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"